services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crashcart
      POSTGRES_PASSWORD: crashcart
      POSTGRES_DB: crashcart
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crashcart"]
      interval: 5s
      timeout: 3s
      retries: 10

  crashcart:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crashcart:crashcart@postgres:5432/crashcart?sslmode=disable
      LISTEN_ADDR: ":8080"
      API_KEYS: ${API_KEYS:-sk-dev-key}
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      RATE_LIMIT: ${RATE_LIMIT:-100}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # SYMBOLICATE_URL: http://symbolicate:8080
    ports:
      - "8080:8080"

  # Optional dSYM symbolication sidecar (iOS). Uncomment SYMBOLICATE_URL above.
  # symbolicate:
  #   build: ./container/symbolicate

volumes:
  pgdata:
