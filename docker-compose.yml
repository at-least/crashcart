services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: crashcart
      POSTGRES_PASSWORD: crashcart
      POSTGRES_DB: crashcart
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crashcart -d crashcart"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  crashcart:
    image: ghcr.io/crashcartapp/crashcart:latest
    # To build from source instead: comment out `image:` and uncomment this.
    # build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crashcart:crashcart@db:5432/crashcart?sslmode=disable
      LISTEN_ADDR: ":8080"
      # Bearer keys for /api/* (comma-separated). Empty = open.
      API_KEYS: ""
      # HTTP basic auth for the viewer. Empty = open.
      VIEWER_PASSWORD: ""
      # Externally visible base URL, used to print DSNs.
      PUBLIC_URL: "http://localhost:8080"
      RETENTION_DAYS: "30"
      # Uncomment with the sidecar below to symbolicate iOS crashes.
      # SYMBOLICATE_URL: http://symbolicate:8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Optional dSYM symbolication sidecar (llvm-symbolizer). ProGuard and
  # source maps resolve in-process and do not need it.
  # symbolicate:
  #   build: ./container/symbolicate
  #   restart: unless-stopped

volumes:
  pgdata:
