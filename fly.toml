# Fly.io: `fly launch --copy-config --no-deploy` picks this up.
# Docs: https://crashcart.app/deploy/fly
app = "crashcart"
primary_region = "nrt"

[build]
  image = "ghcr.io/crashcartapp/crashcart:latest"

[env]
  LISTEN_ADDR = ":8080"
  RETENTION_DAYS = "30"
  # PUBLIC_URL is set with `fly secrets set` once you know the hostname.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # scale to zero when idle
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
