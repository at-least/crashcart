name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crashcart
          POSTGRES_PASSWORD: crashcart
          POSTGRES_DB: crashcart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crashcart"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify generated code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          go install github.com/a-h/templ/cmd/templ@v0.3.1001
          sqlc generate && templ generate
          git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://crashcart:crashcart@localhost:5432/crashcart?sslmode=disable
      - run: go build ./...
