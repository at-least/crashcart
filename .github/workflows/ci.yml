name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crashcart
          POSTGRES_PASSWORD: crashcart
          POSTGRES_DB: crashcart
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U crashcart"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Test (unit + gendocs check)
        run: make test
      - name: Test (DB-backed)
        env:
          TEST_DATABASE_URL: postgres://crashcart:crashcart@localhost:55432/crashcart?sslmode=disable
        run: make test-db
