name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [timescale, plain]   # the schema variant the migrator picks
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: crashcart
          POSTGRES_PASSWORD: crashcart
          POSTGRES_DB: crashcart
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crashcart -d crashcart"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: Unit + DB-backed tests
        env:
          TEST_DATABASE_URL: postgres://crashcart:crashcart@127.0.0.1:5432/crashcart?sslmode=disable
          TEST_PLAIN: ${{ matrix.variant == 'plain' && '1' || '' }}
        run: make test-db
