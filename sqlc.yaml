version: "2"
sql:
  - engine: postgresql
    schema: internal/db/sqlc_schema.sql
    queries: internal/db/queries
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        json_tags_case_style: snake
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "uuid"
            go_type:
              import: "github.com/at-least/crashcart/internal/sentry"
              type: "ID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/at-least/crashcart/internal/sentry"
              type: "ID"
              pointer: true
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type: "encoding/json.RawMessage"
